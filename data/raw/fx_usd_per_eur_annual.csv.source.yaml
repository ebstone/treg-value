notes: >
  Needed because the analogy leg of the manufacturing benchmark is ten Ham
  et al. 2020, whose figures are 2018 euros. Conversion follows the standard
  order for international cost data: convert currency at the SOURCE year's
  rate, then inflate in the target currency -- not inflate in euros and
  convert at today's rate, which would mix two countries' price paths.
  Market exchange rates, not purchasing-power parity: the inputs being
  priced (GMP facility time, specialised reagents, cleanroom equipment) are
  internationally traded, which is the case where market rates are the
  conventional choice.
