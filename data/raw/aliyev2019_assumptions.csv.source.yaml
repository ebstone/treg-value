notes: >
  29 rows total: Induction 1-8, Maintenance 1-13, Quality of Life 1-2,
  Costs 1-6 -- matches the count the W2 prompt expects. All 29 rows were
  legible at 400 DPI and are transcribed at full confidence; none needed a
  confidence: low flag. Three transcription errors were caught and
  corrected during a first low-resolution pass before this sidecar was
  written: Maintenance #11's cycle probability is 0.05, not 1; Maintenance
  #13 and Induction #8 both read "No vial sharing", not "No aid sharing";
  Costs #6 is "3.5 hours" of Surgery treatment time, not "1.5 hours"; and
  Quality of Life #1 cites "Buxton 2007", not "Baron 2007" -- kept here as a
  record of what the trap actually looks like in practice, not just a
  warning.
  Several justification cells refer to earlier rows ("See justification for
  Induction assumption #4/#7/#8") rather than repeating text -- transcribed
  exactly as printed, not expanded/resolved.
  Parent-article citation confirmed via web search against the DOI
  (10.1002/phar.2208), which matches the source filename's "phar2208"
  prefix -- journal is Pharmacotherapy, not PharmacoEconomics as an earlier
  draft of this sidecar guessed from SPEC.md's informal "Aliyev 2019" label
  alone.
