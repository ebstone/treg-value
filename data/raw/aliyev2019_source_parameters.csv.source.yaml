notes: >
  59 rows total, matching the W2 prompt's expected count. `alpha`/`beta` are
  the named distribution parameters as printed (not necessarily shape/rate
  or shape/scale in a single consistent sense across Beta/Uniform/Gamma --
  see the source table's own footnotes, transcribed below). `-` in
  distribution/alpha/beta (rows 54-59, plus row for Drug Administration) is
  transcribed exactly as printed; those six rows are point estimates with no
  stated distribution, used as-is in Aliyev's base case.
  Source table footnotes (transcribed, not summarized): "Beta distribution
  parameters were defined for proportions from the referenced clinical
  trials." / "Gamma distribution parameters were fit using the method of
  moments approach." / "Uniform distributions were applied to parameters
  lacking reliable mean and variance information." / "All costs were
  converted to 2017 USD." / "References are from main manuscript" (i.e. the
  numeric `reference_source` values, e.g. 12, 21, are citation numbers in
  Aliyev's own reference list, not reproduced here -- resolving them requires
  the main manuscript, not just this appendix).
unresolved:
  - id: U1
    issue: >
      Row 45 ("Infusion Minutes of Treatment Time") prints Base Case Value
      as "$150" -- a dollar sign on a minutes-denominated row, inconsistent
      with the three sibling Time rows (84, 210, 37), none of which carry a
      currency symbol. Confirmed present in both the PDF's text layer and a
      600 DPI rendering, so this is not a transcription artifact -- it
      appears to be a genuine formatting error in Aliyev's own published
      table (likely inherited currency formatting from an adjacent column
      in the source spreadsheet). Transcribed verbatim as "$150". A
      consumer treating this as a time value in minutes should read it as
      150, not $150; a consumer treating it as a cost should look elsewhere,
      since no other Time row has a dollar value and Direct Cost rows are
      a separate category.
    blocks: derive/ script for treatment-time costs (W3 or later)
