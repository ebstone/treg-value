notes: >
  Supersedes the 2026-04-quarter version of this file (sha256
  b6d22d63d9ec1dbca006a4e5504d32ddd21651d49e03aa666cf92c2b9bf7b37a, still in
  git history) -- closes U2, see below. Q5121 (Avsola) added; it has become
  a preferred product for some commercial plans as of 2026-01, per the prior
  version's note. Q5109 (Ixifi) was searched for in this same source file
  and not found -- may no longer be marketed or listed under this payer's
  formulary; not fabricated as a data point.

  U1 and U2 from the prior version of this sidecar are resolved, not carried
  forward as unresolved items:
  U1 (was: is "Payment Limit" ASP+6% or raw ASP?) -- CMS's ASP methodology
  defines the published "payment limit" as ASP + 6% by statute/definition,
  confirmed via CMS's own ASP-reporting program page language ("most
  separately payable drugs and biological products have a payment limit of
  the average sales price plus 6 percent") and this source file's own
  framing ("Payment Allowance Limits for Medicare Part B Drugs"). The column
  was already the payment limit; no further adjustment needed.
  U2 (was: 2026-04 is stale) -- this file now uses the 2026-07 quarter,
  current as of the 2026-08-12 retrieval date.
  U4 (was: J1745 not retrieved) -- now included, resolving the S4 blocker too.

  U3 (was: which of the three biosimilars prices the base case?) is resolved
  as of 2026-08-13: Q5104 (Renflexis), $2.6615/mg at this quarter, decided by
  Stone and recorded in OPEN_QUESTIONS.md C10 and SPEC_AMENDMENTS.md. It is
  the lowest priced of the three biosimilars here, so the comparator arm is
  the cheapest available and the resulting justifiable prices are the
  smallest -- the conservative direction. J1745 (originator, $3.1479/mg)
  prices scenario S4. No unresolved items remain against this file.
