  U1 and U2 from the prior version of this sidecar are resolved, not carried
  forward as unresolved items:
  U1 (was: is "Payment Limit" ASP+6% or raw ASP?) -- CMS's ASP methodology
  defines the published "payment limit" as ASP + 6% by statute/definition,
  confirmed via CMS's own ASP-reporting program page language ("most
  separately payable drugs and biological products have a payment limit of
  the average sales price plus 6 percent") and this source file's own
  framing ("Payment Allowance Limits for Medicare Part B Drugs"). The column
  was already the payment limit; no further adjustment needed.
  U2 (was: 2026-04 is stale) -- this file now uses the 2026-07 quarter,
  current as of the 2026-08-12 retrieval date.
  U4 (was: J1745 not retrieved) -- now included, resolving the S4 blocker too.
