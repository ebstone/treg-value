notes: >
  The pre-pandemic life-table vintage SPEC.md scenario S7 asks for, and the
  counterpart to nchs_life_table_2023.csv which the base case uses. 2019 is
  the last published year wholly unaffected by COVID-era mortality.
  Life expectancy at the model's start age of 35 is 45.5 years here against
  45.2 in the 2023 vintage, so the scenario tests roughly a third of a year
  of additional survival.
  A parsing trap worth recording: this report writes its terminal row as
  "100 and over" where the 2023 report writes "100 and older". A parser
  matching only the 2023 wording drops the absorbing row silently and
  produces a 100-row table whose cohort never fully exhausts. Both spellings
  are now accepted, and the row count is asserted.
