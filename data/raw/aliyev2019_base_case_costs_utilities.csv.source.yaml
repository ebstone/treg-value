notes: >
  Added beyond W2_session_prompt.md's original four-file target list. Became
  necessary when the "Direct Cost per Cycle" figures here (used directly by
  Aliyev's model, per the panel title "Base case costs...") turned out not
  to reconcile with aliyev2019_source_parameters.csv's Moderate-Severe PMPM
  figure via the stated PMPM-to-cycle conversion rule -- see
  OPEN_QUESTIONS.md O9. Per Eric Stone's direction (2026-08-12 session): use
  this table's adopted per-cycle figures directly wherever the goal is
  replicating what Aliyev's model actually did, rather than re-deriving
  them from Suppl. Table 2's PMPM inputs.
  "Direct Cost per Cycle" rows for Moderate-Severe and Moderate-Severe
  Responder are identical (217 each) -- consistent with Suppl. Table 1
  Costs assumption #4 ("Equivalent health state costs for M-S and M-SR").
  Adverse Event Weighting Factors and the Utilities panel's health-state
  EQ-5D values were not independently cross-checked against a second
  extraction method (no usable text layer existed to check against, unlike
  Tables 2-4) -- transcribed once, at 600 DPI, high confidence but single-
  pass.
