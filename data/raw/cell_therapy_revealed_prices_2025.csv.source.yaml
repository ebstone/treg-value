notes: >
  Feeds the "revealed prices" leg of the SPEC.md section 8 manufacturing
  benchmark, and nothing else. Under L8 no pricing function may read it, so
  it cannot reach the frontier; T12 asserts that by grep.
  List price is WAC and is not what a payer nets after confidential
  discounts and rebates, so it overstates realised revenue.
unresolved:
  - id: U1
    issue: >
      Cost of goods is reported for one product only (Breyanzi, $200,000 to
      $360,000 per dose as of 2023) and comes from trade press rather than
      an audited filing. Every other product carries a list price and no
      COGS. The benchmark therefore leans on a single COGS observation for
      its autologous upper anchor.
    blocks: nothing in the frontier; widens the benchmark range
  - id: U2
    issue: >
      All five products are AUTOLOGOUS CAR-T, where one manufacturing run
      serves one patient. An allogeneic Treg product amortises a batch
      across many doses, so these figures are an upper bound on a
      fundamentally different manufacturing model rather than a like-for-like
      comparator. The allogeneic anchor comes from ten Ham instead.
    blocks: nothing; recorded so the range is not read as like-for-like
