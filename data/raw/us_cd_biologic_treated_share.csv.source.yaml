notes: >
  **These are a treatment-line proxy for severity (share of diagnosed CD
  patients on biologic/advanced therapy), not a clinical severity
  classification (e.g. Montreal behavior, or a formal mild/moderate/severe
  read).** SPEC.md's own O11 note and S-6 say "a published moderate-to-
  severe or advanced-therapy share" -- this file sources the
  advanced-therapy-share half of that phrase, not a severity read
  independent of treatment.

  **The two sources materially disagree, and neither supersedes the
  other cleanly:**
  - Yu 2018 (MarketScan, privately-insured commercial claims, all ages):
    21.8% (2007) -> 43.8% (2015).
  - Xu 2022 (IQVIA AEMR, prescriptions written at outpatient encounters,
    all ages): 13.3% (2011) -> 32.1% (2020).
  Xu's 2020 endpoint (32.1%) is LOWER than Yu's 2015 endpoint (43.8%),
  five years earlier -- the opposite of the monotonic-increase direction
  both papers' own trend lines otherwise show. This is not an error in
  transcription (both numbers are quoted directly from each paper's own
  results text); it is a genuine disagreement between two legitimate,
  peer-reviewed, differently-sourced estimates, structurally similar to
  the Aliyev Suppl. Table 2 vs Suppl. Table 5 gap this repository resolved
  as C8 -- recorded here rather than silently resolved by picking one.

  Candidate explanations for the gap, none confirmed: (a) different cohort
  definitions -- Yu's denominator is patients already claims-active that
  year (arguably a narrower, more treatment-engaged population), Xu's is
  any coded outpatient encounter; (b) different data types -- Yu counts
  paid claims/infusions (drug actually administered/reimbursed), Xu counts
  written prescriptions at ambulatory encounters, which may miss
  infusion-center-administered infliximab if not captured as an
  "outpatient EMR prescription" in that system; (c) different payer mix --
  MarketScan is privately-insured only, AEMR's payer mix is not stated in
  the abstract and may include populations with more access friction.

  Both figures are also now stale for a 2026 base case regardless of which
  is preferred: Xu's data ends 2020, before risankizumab (CD indication
  approved 2022) and upadacitinib (2023) were approved for CD, and before
  mirikizumab (CD indication approved January 2025 -- corrected 2026-09-10;
  originally miswritten here as 2024, which is mirikizumab's earlier
  ulcerative-colitis approval, not its Crohn's one) and guselkumab (CD
  indication approved March 2025) -- four more advanced-therapy options
  than either cohort's treatment era included. If anything, both figures
  are floors on a current share, not current estimates.
