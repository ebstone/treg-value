unit_note: >
  Native cycle length is 2 weeks, matching Table 3 and SPEC.md's convention.
notes: >
  The three biologic sub-tables (UST, IFX, ADA) have only 5 "from" rows --
  Moderate-Severe Responder, Mild, Remission, Surgery, Death -- with no
  "from Moderate-Severe" row, though Moderate-Severe is a destination
  column. This is not a transcription gap: it is consistent across all
  three and matches aliyev2019_assumptions.csv Maintenance assumption #2
  ("Any patients that lose response, i.e. transition into M-S state, ...
  are switched to CT at the end of the first cycle during which they lost
  response") -- a biologic-maintenance patient who reaches Moderate-Severe
  leaves this Markov immediately, so no "from Moderate-Severe" row is ever
  needed for a biologic arm. The Conventional Therapy (CT) sub-table, by
  contrast, does have a "from Moderate-Severe" row (0.854/0.050/0.050/0/
  0.0456/0.00006) -- this is where that redirected mass goes, and is the row
  R/markov_engine.R actually uses once a patient switches off a biologic.
  Surgery and Death row values are numerically identical across all four
  arms (0.0153/0.010/0.010/0.868/0.0976/0.00006 and 0/0/0/0/0/1
  respectively) -- consistent with Maintenance assumption #8 ("All
  biologics reduce risk of Surgery by the same amount") and #9 ("M-S and
  M-SR states have the same probability of Surgery"), corroborating rather
  than contradicting the assumptions table.
  `total` is transcribed exactly as printed (each row states 1.000); actual
  row sums of the six transcribed probabilities deviate from 1.000 by up to
  0.001, consistent with independent per-cell rounding in the source (3-4
  significant figures per cell).
