notes: >
  This file replaces a hardcoded constant. SPEC.md section 7 names both analogs
  and both readout timepoints, but until this file existed those timepoints lived
  only in R/analog_comparison.R's ANALOG_READOUTS_WEEKS vector with no source of
  any kind. The numeric timepoints are unchanged: 104 weeks (24 months) and 8
  weeks, exactly as SPEC.md section 7 states them.

  The `indication`, `product_class` and `reported_endpoint` columns carry no
  numeric weight -- nothing computes from them. They exist because the readout
  timepoint alone does not tell a reader what the analog measured, and the
  comparison is easy to over-read without them.

  Neither analog's reported endpoint is sustained drug-free remission, which is
  what this study's cure fraction measures. Neither analog's own achieved value
  is recorded here or used anywhere: SPEC.md section 7's rule consumes the
  timepoint only, and `analog_comparison_table()` reports this model's own
  predicted share decayed to that date. No numeric equivalence between this study
  and either analog is asserted by any output.
unresolved:
  - id: U1
    issue: >
      marek_trzonkowska_2016 studies AUTOLOGOUS POLYCLONAL regulatory T cells in
      children with TYPE 1 DIABETES. It is not a Crohn's disease trial and not an
      allogeneic product, so it differs from this study's subject on indication,
      donor source and clonality. Its 24-month follow-up is genuine and is the
      only element SPEC.md section 7 draws on. Its remission definition is a
      reduced insulin dose together with preserved C-peptide, and the paper
      records that all subjects eventually required insulin again -- so its
      "remission" is not a drug-free state.

      "PTG-007" is the sponsor's later commercial designation for the polyclonal
      Treg programme descending from this academic work; the paper itself does not
      use the code. SPEC.md section 7's label is therefore an attribution, not a
      name the cited source carries.

      Retained by author decision (Stone, 2026-09-15) with the mismatch disclosed
      rather than dropped. Any manuscript reporting this row must state the
      indication and endpoint mismatch, or a reader will take both analogs for
      Crohn's disease trials.
    blocks: nothing computational; a reporting obligation, recorded in SPEC_AMENDMENTS.md
  - id: U2
    issue: >
      desreumaux_2012 reports response at weeks 5 and 8. SPEC.md section 7 uses
      week 8, the later of the two, which is the conservative choice of the pair
      and the one the published abstract leads with. The trial is a single-
      injection dose-escalation study in 20 patients across four dose levels, so
      its week-8 figure is not a single-arm effect estimate.
    blocks: nothing; this analog reads out before the 12-week landmark and is already reported as not comparable
