retrieved: 2026-09-15
retrieved_via: >
  Bibliographic fields verified against Crossref REST API records
  (api.crossref.org/works) for both DOIs, which returned the full author lists,
  titles, journals, volumes, issues, pages and years transcribed above.
  marek_trzonkowska_2016's study characteristics were read from the open-access
  full text at PMC5131539. PubMed and gastrojournal.org both refuse programmatic
  fetches (cookie wall and HTTP 403 respectively), so neither was used as a
  transcription source.
